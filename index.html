<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼬마 과학자의 실험실</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8fb;--grid:#dce9f0;--card:#fff;--ink:#16323f;--sub:#52707e;--line:#b9cdd8;--acc:#0f7c8a;--acc2:#e3f4f5;--hl:#ffe36e;--hlt:#4a3b00;--warn:#8a5200;--warnbg:#fff2d2;--bar:#0f7c8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c23;--grid:#17303a;--card:#162832;--ink:#e6f1f5;--sub:#9db8c4;--line:#37535f;--acc:#4cc3d1;--acc2:#12363d;--hl:#ffe36e;--hlt:#3a2e00;--warn:#ffcf7a;--warnbg:#3a2f12;--bar:#4cc3d1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c23;--grid:#17303a;--card:#162832;--ink:#e6f1f5;--sub:#9db8c4;--line:#37535f;--acc:#4cc3d1;--acc2:#12363d;--hl:#ffe36e;--hlt:#3a2e00;--warn:#ffcf7a;--warnbg:#3a2f12;--bar:#4cc3d1;color-scheme:dark}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1,h2{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400;margin:0}
h1{font-size:30px}
h2{font-size:24px;margin-bottom:4px}
.sub{color:var(--sub);margin:0 0 16px}
nav{display:flex;gap:6px;margin:14px 0 20px}
nav button{flex:1;padding:10px 4px;border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{border-color:var(--acc);background:var(--acc);color:#fff;font-weight:700}
nav button.done{color:var(--acc);border-color:var(--acc)}
nav button:disabled{opacity:.55;cursor:default}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px 18px}
.f{margin:0 0 24px;padding-left:12px;border-left:4px solid transparent}
.f>label,.f>.l{display:block;font-weight:700;font-size:17px;margin-bottom:2px}
.f small{display:block;color:var(--sub);margin-bottom:8px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--hl);outline-offset:1px;border-color:var(--acc)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.row .x{flex:none;width:38px;height:38px;border:2px solid var(--line);background:none;color:var(--sub);border-radius:8px;cursor:pointer;font-size:18px}
.two{display:grid;grid-template-columns:1fr 130px;gap:8px}
.btn{font:inherit;border:2px solid var(--acc);background:var(--acc2);color:var(--acc);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:700}
.btn.main{background:var(--acc);color:#fff;padding:11px 22px;font-size:17px}
.hint{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:7px 11px;margin:6px 0 0;font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--acc);flex:none}
.bar{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.scroll{overflow-x:auto;margin-bottom:8px}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{border:2px solid var(--line);padding:6px;text-align:center}
th{background:var(--acc2);font-weight:700}
td input{text-align:center;padding:7px 4px}
td.m{font-weight:700;background:var(--acc2)}
td.c{text-align:left;font-weight:500}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{font:inherit;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
.seg button.on{border-color:var(--acc);background:var(--acc);color:#fff;font-weight:700}
svg{width:100%;height:auto;display:block;background:var(--bg);border:2px solid var(--line);border-radius:10px}
svg text{fill:var(--ink);font-family:"Noto Sans KR",sans-serif}
.empty{color:var(--sub);padding:28px 8px;text-align:center;border:2px dashed var(--line);border-radius:10px}
.reset{background:none;border:none;color:var(--sub);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}
.f.bad{border-left-color:#e0533f}.gate{margin-top:14px}.gate ul{margin:6px 0 0;padding-left:20px}.mvc{white-space:nowrap;width:1%}.seg.big button{flex:1;font-size:20px;padding:12px 6px;font-family:Jua,sans-serif}.unit{display:block;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}.unit:hover{border-color:var(--acc)}.unit b{font-size:17px;display:block}.unit span{color:var(--sub);font-size:14px}
[hidden]{display:none!important}
.grip{border:2px solid var(--line);background:var(--bg);color:var(--sub);border-radius:6px;width:38px;height:38px;cursor:grab;font-size:20px;line-height:1}.grip:active{cursor:grabbing}
tr.drag{outline:3px solid var(--acc)}tr.drag td{background:var(--acc2)}
.auto{background:var(--acc2);border-radius:8px;padding:8px 12px;margin:6px 0 10px}.auto p{margin:3px 0}.auto ol{margin:2px 0;padding-left:22px}
.sq label{display:block;font-weight:700;margin:14px 0 2px}.sq small{display:block;color:var(--sub);margin-bottom:6px}
.ck{list-style:none;padding:0;margin:4px 0 8px}.ck li{padding:4px 0}.ck .ok b{color:var(--acc)}.ck .no b{color:#e0533f}.ck .tip b{color:var(--warn)}
.rep{margin-top:26px;padding:18px;border:2px dashed var(--line);border-radius:12px;background:var(--card)}
.rh{font-size:17px;font-weight:700;margin:16px 0 4px;border-bottom:1px solid var(--line)}.rp{white-space:pre-wrap;margin:4px 0}
@media print{:root:root:root{--ink:#000;--bg:#fff;--card:#fff;--line:#999;--sub:#444;--acc:#0f7c8a;--acc2:#e3f4f5;--bar:#0f7c8a}
body{background:#fff;color:#000}nav,h1,main>p,.noprint,#nav{display:none!important}main{padding:0}.panel{border:none;padding:0;background:#fff}.rep{border:none;margin:0;padding:0}svg{break-inside:avoid}}
.panel.intro{border:none;background:none;padding:0}.hero{text-align:center;padding:8px 0 24px}.hero svg{width:min(320px,86%);margin:0 auto;background:none;border:none;border-radius:0}.hero h2{font-size:38px;margin:10px 0 6px}.btn.main.big{font-size:22px;padding:14px 48px;border-radius:999px}
nav button{line-height:1.3}@media(max-width:520px){nav button{font-size:12px;padding:8px 2px}}
</style></head><body>
<main>
<h1 id="ttl">꼬마 과학자의 실험실</h1>
<nav id="nav"></nav>
<div class="panel" id="view"></div>
<p style="text-align:right;margin-top:14px"><button class="reset" id="reset">처음부터 다시 쓰기</button></p>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={q:'',h:'',iv:'',dv:'',unit:'',conds:['',''],ctrl:[''],trials:3,steps:[''],mats:[''],safety:[],data:{},notes:'',oops:'',interp:'',gtype:'bar',g:0,sem:0,ux:null,motive:'',cmp:'',why:'',improve:'',concl:'',chk:[],good:'',better:'',name:''};
let step=-1,tried=false;
try{const t=localStorage.getItem('sciNote1');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
const save=()=>{try{localStorage.setItem('sciNote1',JSON.stringify(S))}catch(e){}};
const filled=a=>a.filter(x=>x.trim());
const young=()=>S.g>0&&S.g<=4;
const concOK=()=>{const c=S.concl.trim();return !!c&&(filled(S.conds).some(x=>c.includes(x.trim()))||/\d/.test(c))};
const concTip=()=>'결론에 측정한 조건(예: '+filled(S.conds).slice(0,2).map(x=>x.trim()).join(', ')+')과 숫자를 함께 넣으면 더 설득력이 높아져요.';
const SAFE=['보안경이나 장갑이 필요한가요?','불, 뜨거운 물, 전기를 쓰나요? 어른과 함께 해요.','가위, 칼 같은 날카로운 도구는 조심해서 써요.','실험 재료를 입에 넣거나 냄새를 직접 맡지 않아요.','실험이 끝나면 정리하고 손을 씻어요.','선생님께 계획을 보여 드리고 확인받았어요.'];

function nav(){
  const i0=step<0;$('#nav').hidden=i0;$('#ttl').hidden=i0;$('#reset').parentElement.hidden=i0;$('#view').classList.toggle('intro',i0);if(i0)return;
  const n=['단원 선택','1. 실험 설계','2. 실험 내용 정리','3. 실험 보고서 쓰기','4. 점검하기'];
  $('#nav').innerHTML=n.map((t,i)=>`<button data-s="${i}" class="${step==i?'on':step>i?'done':''}" ${i>4?'disabled title="준비 중"':''}>${t}${i>4?'<br><small>준비 중</small>':''}</button>`).join('');
  $('#nav').querySelectorAll('button:not(:disabled)').forEach(b=>b.onclick=()=>go(+b.dataset.s));
}
function missing(){
  const m=[],a=(id,msg)=>m.push({id,msg}),t=s=>s.trim(),y=young();
  const q=t(S.q),h=t(S.h),iv=t(S.iv),dv=t(S.dv),cs=filled(S.conds).map(t),ck=filled(S.ctrl).map(t);
  if(!q)a('q','알고 싶은 것을 써요.');
  if(!h)a('h',y?'내 예상을 써요.':'내 생각(가설)을 써요.');
  if(!iv)a('iv','다르게 해야 할 것(바꾸는 것)을 써요.');
  if(cs.length<2)a('conds','비교할 조건을 2개 이상 써요.');else if(new Set(cs).size<cs.length)a('conds','비교할 조건이 서로 달라야 해요.');
  if(!dv)a('dv','측정할 것을 써요.');else if(dv===iv)a('dv','바꾸는 것과 측정하는 것이 같아요. 서로 달라야 해요.');
  if(ck.length&&iv.length>1&&ck.some(c=>c.includes(iv)||iv.includes(c)))a('ctrl','같게 해야 할 것에 바꾸는 것('+esc(iv)+')이 들어 있어요. 바꾸는 것은 같게 할 수 없어요.');
  else if(!y&&!ck.length)a('ctrl','같게 해야 할 것을 1개 이상 써요.');
  if(filled(S.steps).length<(y?1:2))a('steps',y?'실험 방법을 써요.':'실험 방법을 2단계 이상 써요.');
  if(!filled(S.mats).length)a('mats','준비물을 써요.');
  if(S.safety.length<SAFE.length)a('safe','안전 점검을 모두 확인해요.');
  return m;
}
function gateShow(scroll){
  const m=missing(),g=$('#gate');
  document.querySelectorAll('.f.bad').forEach(e=>e.classList.remove('bad'));
  if(!g)return false;
  if(!m.length){g.hidden=true;return false}
  m.forEach(x=>{const e=$('#'+x.id);if(e)e.closest('.f').classList.add('bad')});
  g.hidden=false;
  g.innerHTML='<b>아래를 고치면 다음 단계로 갈 수 있어요.</b><ul>'+m.map(x=>'<li>'+x.msg+'</li>').join('')+'</ul>';
  if(scroll)g.scrollIntoView({block:'center'});
  return true;
}
function go(s){
  if(s>=2&&$('#gate')){tried=true;if(gateShow(true))return}
  step=s;nav();(s==0?view0:s==1?view1:s==2?view2:s==3?view3:view4)();window.scrollTo(0,0);
}

/* 목록 입력기 */
function list(id,key,ph,add){
  const box=$('#'+id),P=Array.isArray(ph)?ph:[ph];
  const draw=()=>{
    box.innerHTML=S[key].map((v,i)=>`<div class="row"><input type="text" data-i="${i}" value="${esc(v)}" placeholder="${esc(P[Math.min(i,P.length-1)])}" aria-label="${i+1}번째"><button class="x" data-r="${i}" aria-label="지우기">×</button></div>`).join('')+`<button class="btn" data-add>＋ ${add}</button>`;
    box.querySelectorAll('input').forEach(el=>el.oninput=()=>{S[key][+el.dataset.i]=el.value;save();hints()});
    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(S[key].length>1)S[key].splice(+b.dataset.r,1);else S[key]=[''];save();draw();hints()});
    box.querySelector('[data-add]').onclick=()=>{S[key].push('');save();draw();box.querySelectorAll('input')[S[key].length-1].focus()};
  };draw();
}
function hint(id,t){const e=$('#'+id);if(e){e.hidden=!t;e.textContent=t||''}}
function hints(){
  const q=S.q.trim(),h=S.h.trim(),y=young();
  hint('hq',q&&!/(까|\?|？|지)\s*$/.test(q)?'끝을 “~일까?”로 마무리해 보면 좋아요.':'');
  hint('hh',h&&!(y?/(것 같|것이다|것이라)/.test(h):(/(면|수록)/.test(h)&&/(것이다|것 같|것이라)/.test(h)))?(y?'“나는 ~할 것 같다.”처럼 써 보면 좋아요.':'“~하면 ~할 것이다.” 또는 “~할수록 ~할 것이다.” 모양으로 써 보면 좋아요.'):'');
  hint('hv',S.iv.trim()&&S.iv.trim()===S.dv.trim()?'바꾸는 것과 측정하는 것이 같아요.':'');
  hint('ht',S.trials<3?'3번 이상 반복하면 결과를 더 믿을 수 있어요.':'');
  if(tried)gateShow();
}

function bind(id,key){const e=$('#'+id);e.value=S[key];e.oninput=()=>{S[key]=e.value;save();hints()}}

const DEF={q:'물의 온도가 높을수록 설탕이 더 빨리 녹을까?',h:'만약 물의 온도를 높이면 설탕이 더 빨리 녹을 것이다.',iv:'물의 온도',c:['10℃','30℃','50℃'],dv:'설탕이 다 녹는 데 걸린 시간',u:'초',k:['물의 양','설탕의 양','젓는 횟수'],s:'컵에 물 100mL를 붓는다.',m:'비커'};
const ex=()=>Object.assign({},DEF,S.ux||{});
const U=a=>({n:a[0],q:a[1],h:a[2],iv:a[3],c:a[4],dv:a[5],u:a[6],k:a[7],s:a[8],m:a[9]});
const UNITS={
'3-1':[
['힘과 우리 생활','고무줄을 당기는 길이에 따라 장난감 자동차가 가는 거리가 다를까?','만약 고무줄을 더 많이 당기면 자동차가 더 멀리 갈 것이다.','고무줄을 당기는 길이',['5cm','10cm','15cm'],'자동차가 나아간 거리','cm',['자동차의 종류','바닥의 종류'],'고무줄을 자동차에 걸고 정해진 길이만큼 당긴다.','장난감 자동차, 고무줄, 자'],
['동물의 생활','쥐며느리는 밝은 곳과 어두운 곳 중 어디에 더 많이 모일까?','만약 쥐며느리를 상자에 풀어 놓으면 어두운 곳에 더 많이 모일 것이다.','쥐며느리가 있는 곳의 밝기',['밝은 곳','어두운 곳'],'각 곳에 모인 쥐며느리의 수','마리',['쥐며느리의 수','상자의 크기','온도'],'상자의 반쪽만 검은 종이로 덮는다.','쥐며느리, 상자, 검은 종이'],
['식물의 생활','물을 주는 횟수에 따라 식물이 자라는 키가 다를까?','만약 물을 자주 주면 식물이 더 많이 자랄 것이다.','물을 주는 횟수',['일주일에 1번','일주일에 3번','매일'],'식물의 키','cm',['식물의 종류','화분의 크기','놓는 장소'],'같은 크기의 화분 세 개에 같은 흙과 씨앗을 심는다.','화분 3개, 흙, 씨앗, 물뿌리개, 자'],
['생물의 한살이','씨를 심는 깊이에 따라 싹이 트는 데 걸리는 시간이 다를까?','만약 씨를 깊게 심으면 싹이 더 늦게 틀 것이다.','씨를 심는 깊이',['1cm','3cm','6cm'],'싹이 트기까지 걸린 날수','일',['씨의 종류','흙의 종류','물 주는 양'],'화분 세 개에 같은 흙을 담고 서로 다른 깊이로 씨를 심는다.','강낭콩 씨, 화분 3개, 흙, 자']].map(U),
'3-2':[
['물체와 물질','막대를 만든 재료에 따라 휘어지는 정도가 다를까?','만약 막대의 재료가 다르면 휘어지는 정도도 다를 것이다.','막대의 재료',['플라스틱','나무','고무'],'막대가 휘어진 길이','cm',['막대의 길이','누르는 힘의 크기'],'책상 끝에 막대를 반쯤 걸쳐 놓는다.','재료가 다른 막대, 자'],

function nice(m){const p=Math.pow(10,Math.floor(Math.log10(m)));for(const k of [1,2,2.5,5,10])if(k*p>=m)return k*p;return m}
function graph(idx){

  const W=640,H=340,L=64,R=16,T=28,B=64,pw=W-L-R,ph=H-T-B;
  const mx=nice(Math.max(...pts.map(p=>p.v),0.0001)),n=pts.length,sl=pw/n;

  for(let k=0;k<=5;k++){const v=mx*k/5;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="13">${fmt(v)}</text>`}

  else{s+=`<polyline fill="none" stroke="var(--bar)" stroke-width="3" points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>`;pts.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="var(--bar)"/><text x="${x(i)}" y="${y(p.v)-10}" text-anchor="middle" font-size="13" font-weight="700">${fmt(p.v)}</text>`})}

  g.innerHTML=s;
}

function dragInit(idx){
  const tb=document.querySelector('tbody');
  tb.querySelectorAll('.grip').forEach(g=>{
    g.style.touchAction='none';g.draggable=false;
    g.onkeydown=e=>{const p=+g.dataset.p,d=e.key=='ArrowUp'?-1:e.key=='ArrowDown'?1:0;if(d&&idx[p+d]!==undefined){e.preventDefault();move(idx[p],idx[p+d],p+d)}};
    g.onpointerdown=e=>{
      if(e.button>0)return;
      e.preventDefault();
      const tr=g.closest('tr');tr.classList.add('drag');document.body.style.userSelect='none';
      const mv=ev=>{
        const nx=[...tb.children].filter(r=>r!==tr).find(r=>{const q=r.getBoundingClientRect();return ev.clientY<q.top+q.height/2});
        if(nx)tb.insertBefore(tr,nx);else tb.appendChild(tr);
      };
      const end=()=>{
        window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);
        tr.classList.remove('drag');document.body.style.userSelect='';
        const ord=[...tb.children].map(r=>+r.dataset.i);
        if(ord.some((v,p)=>v!==idx[p]))applyOrder(idx,ord);
      };
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
    };
  });
}

    ['1. 알고 싶은 것',[S.q.trim(),S.motive.trim()]],
    ['2. '+(young()?'내 예상':'내 생각(가설)'),[S.h.trim()]],
    ['3. 실험 방법',['다르게 한 것: '+S.iv.trim()+' ('+cs.join(', ')+')','같게 한 것: '+filled(S.ctrl).map(x=>x.trim()).join(', '),'측정한 것: '+S.dv.trim()+ut+', '+S.trials+'번 반복','준비물: '+filled(S.mats).map(x=>x.trim()).join(', '),'실험 순서\n'+filled(S.steps).map((x,i)=>(i+1)+'. '+x.trim()).join('\n')]],
    ['4. 실험 결과',rows.concat([S.interp.trim(),S.notes.trim()&&'관찰한 것: '+S.notes.trim()])],
    ['5. 생각해 보기',[L?'내 '+(young()?'예상':'생각')+'은 '+L+'.':'',S.why.trim(),S.oops.trim()&&'이상하거나 실수한 점: '+S.oops.trim(),S.improve.trim()&&'다음에 고치고 싶은 점: '+S.improve.trim()]],
    ['6. 결론',[S.concl.trim()]],
    ['7. 나의 탐구 돌아보기',[S.good.trim()&&'잘한 점: '+S.good.trim(),S.better.trim()&&'더 보완하고 싶은 점: '+S.better.trim()]]
  ].filter(s=>s[1].some(Boolean));
}
function headTxt(){return (S.g?S.g+'학년 '+(S.sem?S.sem+'학기 ':'')+(S.ux&&S.ux.n?'· '+S.ux.n:''):'')+(S.name.trim()?'   이름: '+S.name.trim():'')}
function drawRep(){
  $('#rep').innerHTML=`<h2 style="font-size:26px">과학 탐구 보고서</h2><p>${esc(headTxt())}</p>`+secs().map(s=>`<h3 class="rh">${esc(s[0])}</h3>`+s[1].filter(Boolean).map(x=>`<p class="rp">${esc(x)}</p>`).join('')+(s[0][0]=='4'?'<div id="graph"></div>':'')).join('');
  graph(idxOf());
}
function autoChecks(){
  const idx=idxOf(),cs=filled(S.conds);let tot=idx.length*S.trials,got=0;
  idx.forEach(i=>{for(let k=0;k<S.trials;k++)if(!isNaN(parseFloat(S.data[i+'_'+k])))got++});
  const C=[
    [tot>0&&got==tot,'모든 칸에 측정값이 있어요.','측정값이 빈 칸이 '+(tot-got)+'개 있어요. 2단계에서 확인해요.'],
    [!!S.unit.trim(),'측정값의 단위를 썼어요.','측정값의 단위가 없어요. 1단계에서 써요.'],
    [!!(S.interp.trim()&&S.cmp&&S.why.trim()&&S.concl.trim()),'알게 된 점, '+(young()?'예상':'가설')+' 비교, 까닭, 결론을 모두 썼어요.','3단계에 비어 있는 칸이 있어요. (알게 된 점, '+(young()?'예상':'가설')+' 비교, 까닭, 결론)'],
    [concOK(),'결론에 실험 결과(조건이나 숫자)가 들어 있어요.',concTip(),true]
  ];
  const notes=[];
  idx.forEach(i=>{const v=[];for(let k=0;k<S.trials;k++){const x=parseFloat(S.data[i+'_'+k]);if(!isNaN(x))v.push([k,x])}
    if(v.length>=3){const s=v.map(a=>a[1]).sort((a,b)=>a-b),m=s[Math.floor(s.length/2)];
      v.forEach(([k,x])=>{if(m!==0&&Math.abs(x-m)>Math.abs(m)*.5)notes.push('“'+S.conds[i].trim()+'”의 '+(k+1)+'회 값('+x+')이 다른 값과 많이 달라요. 다시 재 보거나 그 까닭을 3단계에 써 보세요.')})}});
  const mm=idx.map(i=>avg(i)).filter(x=>x!=null);
  if(mm.length>=3){const inc=mm.every((x,j)=>j==0||x>mm[j-1]),dec=mm.every((x,j)=>j==0||x<mm[j-1]);
    const w=inc?'조건 순서대로 평균이 계속 커졌어요.':dec?'조건 순서대로 평균이 계속 작아졌어요.':'조건 순서대로 평균이 커졌다 작아졌다 해요.';
    const W=young()?'예상':'생각',lab={yes:'내 '+W+'이 맞았어요',part:'일부만 맞았어요',no:'내 '+W+'과 달랐어요'}[S.cmp];
    notes.push('내 데이터를 보면 '+w+(lab?' 3단계에서 “'+lab+'”를 골랐는데, 이 모습과 어울리는지 다시 생각해 보세요.':''))}
  return {C,notes};
}
async function copyText(s){
  try{await navigator.clipboard.writeText(s);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=s;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}
function view4(){
  const {C,notes}=autoChecks();
  $('#view').innerHTML=`<div class="noprint"><h2>4. 점검하기</h2><p class="sub">보고서를 내기 전에 스스로 살펴봐요.</p>
<div class="f"><span class="l">자동 점검</span><ul class="ck">${C.map(c=>`<li class="${c[0]?'ok':c[3]?'tip':'no'}"><b>${c[0]?'✔':c[3]?'△':'✖'}</b> ${esc(c[0]?c[1]:c[2])}</li>`).join('')}</ul>${notes.length?'<div class="auto"><b>다시 생각해 볼 점</b>'+notes.map(n=>'<p>'+esc(n)+'</p>').join('')+'</div>':''}</div>
<div class="f"><span class="l">내가 직접 확인하기</span><small id="prog"></small>${chk().map((t,i)=>`<label class="chk"><input type="checkbox" data-c="${i}" ${S.chk.includes(i)?'checked':''}><span>${t}</span></label>`).join('')}</div>
<div class="f"><span class="l">자기 평가</span><div class="sq"><label for="good">이번 탐구에서 내가 잘한 점은 무엇인가요?</label><textarea id="good"></textarea><label for="better">더 보완하고 싶은 점은 무엇인가요?</label><textarea id="better"></textarea></div></div>
<div class="f"><span class="l">보고서 완성하기</span><small>이름을 쓰고, 아래 보고서를 확인한 뒤 인쇄하거나 복사해요.</small><input type="text" id="name" placeholder="이름"><div class="row" style="margin-top:10px"><button class="btn main" id="pr">인쇄하기 / PDF로 저장</button><button class="btn" id="cp">글자로 복사하기</button></div><p class="hint" id="st" hidden></p></div></div>
<div class="rep" id="rep"></div>
<div class="bar noprint"><button class="btn" id="prev3">◀ 이전: 실험 보고서 쓰기</button></div>`;
  const prog=()=>{$('#prog').textContent='확인한 것 '+S.chk.length+' / '+chk().length};prog();
  document.querySelectorAll('[data-c]').forEach(c=>c.onchange=()=>{const k=+c.dataset.c;S.chk=S.chk.filter(x=>x!==k);if(c.checked)S.chk.push(k);save();prog()});
  [['good','good'],['better','better'],['name','name']].forEach(([id,k])=>{const e=$('#'+id);e.value=S[k];e.oninput=()=>{S[k]=e.value;save();drawRep()}});
  $('#pr').onclick=()=>{hint('st','PDF로 저장하려면 인쇄 창에서 “PDF로 저장”을 골라요. 창이 안 열리면 “글자로 복사하기”를 써 보세요.');try{window.print()}catch(e){}};
  $('#cp').onclick=async()=>{const t='과학 탐구 보고서\n'+headTxt()+'\n\n'+secs().map(s=>s[0]+'\n'+s[1].filter(Boolean).join('\n')).join('\n\n');
    hint('st',(await copyText(t))?'복사했어요. 문서나 메모에 붙여 넣을 수 있어요.':'복사가 안 돼요. 아래 보고서를 드래그해서 직접 복사해 주세요.')};
  $('#prev3').onclick=()=>go(3);drawRep();
}
let rc=false;
$('#reset').onclick=e=>{if(!rc){rc=true;e.target.textContent='정말 지울까요? 한 번 더 누르면 모두 지워져요.';setTimeout(()=>{rc=false;e.target.textContent='처음부터 다시 쓰기'},4000);return}
  try{localStorage.removeItem('sciNote1')}catch(x){};location.reload()};
nav();viewIntro();
</script></body></html>
